[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context_pack"
version = "0.1.1"
description = "bounded context pack builder"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Jonah Helland"}]
dependencies = []

[project.scripts]
context-pack = "context_pack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
